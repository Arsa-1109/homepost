[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# H6: the scheduler now dedupes across replicas via a Postgres advisory lock
# (pg_try_advisory_lock on 'rent_reminders'), so scaling beyond 1 replica no
# longer duplicates reminder emails. 1 replica remains the default.
numReplicas = 1
startCommand = "/bin/sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*'"
releaseCommand = "alembic upgrade head"
healthcheckPath = "/health"
healthcheckTimeout = 15
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
