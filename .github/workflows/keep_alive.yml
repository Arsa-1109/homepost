name: Render Keep Alive

# NOTE: GitHub Actions cron scheduling is deprecated for keepalive pings due to
# runner queue delays (which exceed Render's 15-min idle spin-down) and the 60-day repo dormancy limit.
# Production keepalive is handled by external monitoring (UptimeRobot / Cron-job.org).
#
# Manual trigger is preserved below for on-demand smoke tests.
on:
  # schedule:
  #   - cron: '*/10 * * * *'  # Deprecated in favor of UptimeRobot / Cron-job.org
  workflow_dispatch: # Allows manual healthcheck trigger from GitHub UI
    inputs:
      target_url:
        description: 'Target URL to ping (optional override)'
        required: false
        type: string

jobs:
  ping:
    name: Ping Backend Health
    runs-on: ubuntu-latest
    steps:
      - name: Ping Homepost Health Endpoint
        env:
          BACKEND_URL: ${{ inputs.target_url || secrets.RENDER_BACKEND_URL || secrets.BACKEND_URL || vars.RENDER_BACKEND_URL || vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning ::No RENDER_BACKEND_URL or BACKEND_URL configured in GitHub repo Secrets or Variables."
            echo "Please add your backend URL in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          
          # Clean URL trailing slash and append /health
          BASE_URL="${BACKEND_URL%/}"
          TARGET_URL="${BASE_URL}/health"
          
          echo "Pinging ${TARGET_URL}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$TARGET_URL" || echo "000")
          
          echo "HTTP Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Render backend instance is active and warm! (Status: $HTTP_STATUS)"
          else
            echo "::warning ::Ping returned status $HTTP_STATUS (instance may be waking up or warming up)."
          fi

