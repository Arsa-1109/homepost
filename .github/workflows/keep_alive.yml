name: Render Keep Alive
on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Homepost Render Health Endpoint
        run: |
          curl -s -f https://<your-render-app-name>.onrender.com/health || echo "Ping failed or starting up"
